---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-keyvault-sync-controller
  namespace: kube-system
  labels:
    app: azure-keyvault-sync-controller

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: azure-keyvault-sync-controller
  labels:
    app: azure-keyvault-sync-controller
rules:
  # AzureKeyVaultSync CRD permissions
  - apiGroups: ["azure-keyvault-sync.io"]
    resources: ["azurekeyvaultsyncs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # AzureKeyVaultSync status subresource
  - apiGroups: ["azure-keyvault-sync.io"]
    resources: ["azurekeyvaultsyncs/status"]
    verbs: ["get", "update", "patch"]

  # SecretProviderClass permissions
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Secret permissions (for annotation mode)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "update", "patch"]

  # Token request permissions (for service account impersonation)
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: azure-keyvault-sync-controller
  labels:
    app: azure-keyvault-sync-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: azure-keyvault-sync-controller
subjects:
  - kind: ServiceAccount
    name: azure-keyvault-sync-controller
    namespace: kube-system
