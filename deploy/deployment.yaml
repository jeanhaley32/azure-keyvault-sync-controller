---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-keyvault-sync-controller
  namespace: kube-system
  labels:
    app: azure-keyvault-sync-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-keyvault-sync-controller
  template:
    metadata:
      labels:
        app: azure-keyvault-sync-controller
    spec:
      serviceAccountName: azure-keyvault-sync-controller
      containers:
        - name: controller
          image: ghcr.io/jeanhaley32/azure-keyvault-sync-controller:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
