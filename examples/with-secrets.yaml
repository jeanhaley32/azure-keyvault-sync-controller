# SecretProviderClass with automatic Kubernetes Secret generation
# The controller will populate both the objects array and secretObjects array,
# causing the CSI driver to automatically create Kubernetes Secrets.
#
# IMPORTANT: Kubernetes Secret generation is controlled by Azure Key Vault tags, not annotations!
# Tag your secrets/certificates in Azure with:
#   - secret-object="true" for Opaque Secrets
#   - cert-object="true" for TLS Secrets
#
# Example tagging commands:
#   az keyvault secret set-attributes --vault-name example-vault --name db-password --tags secret-object=true
#   az keyvault certificate set-attributes --vault-name example-vault --name tls-cert --tags cert-object=true

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: example-with-secrets
  namespace: default
  annotations:
    # ServiceAccount to impersonate for vault access
    # Presence of this annotation enables automatic sync (implicit opt-in)
    azure-keyvault-sync/service-account: "example-app"
spec:
  provider: azure
  parameters:
    # Azure Key Vault name
    keyvaultName: "example-vault"
    # Client ID of the Azure Managed Identity
    clientID: "00000000-0000-0000-0000-000000000000"
    # Azure AD Tenant ID
    tenantId: "11111111-1111-1111-1111-111111111111"
    # Objects array will be auto-populated by the controller
    objects: ""
  # secretObjects array will be auto-populated by the controller
  secretObjects: []
