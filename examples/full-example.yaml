# Complete example showing all available annotations and configuration
# This demonstrates all features of the Azure Key Vault Sync Controller.

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: example-full
  namespace: default
  annotations:
    # REQUIRED: ServiceAccount to impersonate for vault access
    # Presence of this annotation enables automatic sync (implicit opt-in)
    # This ServiceAccount must have:
    # - Azure Workload Identity annotation: azure.workload.identity/client-id
    # - Federated Identity Credential configured in Azure
    azure-keyvault-sync/service-account: "example-app"

    # OPTIONAL: Enable tag-based filtering to selectively sync secrets
    # Requires 'service' label on SPC, optional 'environment' label
    # azure-keyvault-sync/respect-tags: "true"

    # AUTO-POPULATED: Last successful sync timestamp (set by controller)
    # azure-keyvault-sync/last-sync: "2025-10-27T00:00:00Z"
spec:
  provider: azure
  parameters:
    # Azure Key Vault name (without .vault.azure.net suffix)
    keyvaultName: "example-vault"

    # Client ID of the Azure User-Assigned Managed Identity
    # This identity must have:
    # - Key Vault Secrets User role on the vault
    # - Key Vault Certificates User role on the vault
    clientID: "00000000-0000-0000-0000-000000000000"

    # Azure AD Tenant ID where the Managed Identity exists
    tenantId: "11111111-1111-1111-1111-111111111111"

    # Objects array - AUTO-POPULATED by controller
    # Controller discovers all enabled secrets and certificates from vault
    # and automatically generates this array. Vault is the source of truth.
    # Format after population:
    # objects: |
    #   array:
    #     - objectName: secret-name
    #       objectType: secret
    #       objectVersion: ""
    #     - objectName: cert-name
    #       objectType: cert
    #       objectVersion: ""
    objects: ""

  # secretObjects array - AUTO-POPULATED by controller based on vault tags
  # Controller generates Kubernetes Secret definitions ONLY for vault items tagged with:
  #   - secret-object="true" (creates type: Opaque)
  #   - cert-object="true" (creates type: kubernetes.io/tls)
  # CSI driver uses this to automatically create Secrets in the namespace.
  #
  # Tag secrets in Azure:
  #   az keyvault secret set-attributes --vault-name example-vault --name db-password --tags secret-object=true
  #   az keyvault certificate set-attributes --vault-name example-vault --name tls-cert --tags cert-object=true
  #
  # Format after population:
  # secretObjects:
  #   - secretName: db-password
  #     type: Opaque
  #     data:
  #       - key: db-password
  #         objectName: db-password
  #   - secretName: tls-cert
  #     type: kubernetes.io/tls
  #     data:
  #       - key: tls.key
  #         objectName: tls-cert
  #       - key: tls.crt
  #         objectName: tls-cert
  secretObjects: []

---
# Example ServiceAccount with Azure Workload Identity annotation
# This ServiceAccount must have a Federated Identity Credential configured in Azure
# that trusts tokens from this Kubernetes ServiceAccount.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-app
  namespace: default
  annotations:
    # Azure Workload Identity annotation - links to Azure Managed Identity
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
    # Optional: Specify tenant if different from cluster default
    # azure.workload.identity/tenant-id: "11111111-1111-1111-1111-111111111111"

---
# Example Pod using the SecretProviderClass
# The CSI driver mounts secrets into the pod's filesystem.
# If secretObjects are configured, Kubernetes Secrets are also created.

apiVersion: v1
kind: Pod
metadata:
  name: example-app
  namespace: default
  labels:
    # Required for Azure Workload Identity injection
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: example-app
  containers:
    - name: app
      image: nginx:alpine
      volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets"
          readOnly: true
      env:
        # Example: Use secret from Kubernetes Secret (if secretObjects enabled)
        - name: SECRET_VALUE
          valueFrom:
            secretKeyRef:
              name: secret-name  # Matches vault secret name
              key: secret-name
  volumes:
    - name: secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "example-full"
